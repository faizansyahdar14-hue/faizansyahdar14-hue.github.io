<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Login - Faizandhaa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="glass-container">
    <div class="login-box">
        <div class="header-section">
            <div class="profile-icon">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2>Login</h2>
            <p>Silahkan verifikasi identitas Anda</p>
        </div>

        <form id="authForm">
            <div class="input-group-custom">
                <i class="fas fa-user"></i>
                <input type="text" id="userInput" placeholder="Username" required autocomplete="off">
            </div>

            <div class="input-group-custom mt-4">
                <i class="fas fa-lock"></i>
                <input type="password" id="passInput" placeholder="Password" required>
                <i class="fas fa-eye" id="toggleBtn"></i>
            </div>

            <button type="submit" id="submitBtn" class="mt-4">
                <span>MASUK</span>
                <i class="fas fa-sign-in-alt"></i>
            </button>
        </form>

        <div id="statusReport" class="mt-3"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
