<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page - Faizandhaa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-image"></div>
    
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="login-card p-4">
            <h3 class="text-center text-white mb-4">Login</h3>
            <form id="authForm">
                <div class="mb-3">
                    <label class="form-label text-white small">Username</label>
                    <input type="text" id="userInput" class="form-control" placeholder="Masukkan Username" required autocomplete="off">
                </div>
                <div class="mb-3">
                    <label class="form-label text-white small">Password</label>
                    <div class="input-group">
                        <input type="password" id="passInput" class="form-control" placeholder="Masukkan Password" required>
                        <button class="btn btn-light" type="button" id="toggleBtn">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary w-100 mt-3">Login</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="#" class="text-white-50 x-small" style="text-decoration: none; font-size: 0.8rem;">Forgot Password?</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
