<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Login Siswa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-header">
            <i class="fa-solid fa-user-shield"></i>
            <h1>Authorized Access</h1>
        </div>
        
        <form id="formLogin">
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="userInput" placeholder="Username" required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="passInput" placeholder="Password" required>
            </div>

            <button type="submit">LOGIN SEKARANG</button>
        </form>
        
        <p id="errorNote"></p>
    </div>

    <script src="main.js"></script>
</body>
</html>
